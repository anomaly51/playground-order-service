name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  docker-pr:
    if: github.event_name == 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: false

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    needs: tests
    environment: ${{ github.ref_name == 'dev' && 'dev' || 'staging' }}
    runs-on: arc-runner-set
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare image metadata
        id: metadata
        shell: bash
        run: |
          printf 'tag=%s-%s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_NAME" == "dev" ]]; then
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          else
            echo "channel=staging" >> "$GITHUB_OUTPUT"
          fi
          printf 'created=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Set up remote Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: remote
          endpoint: tcp://arc-buildkit.arc-runners.svc.cluster.local:1234
      - name: Read registry credentials
        id: vault
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b # v3
        with:
          url: https://vault.internal.api-api-api.com
          method: jwt
          path: github
          role: ci-playground-order-service
          jwtGithubAudience: playground-ci
          exportEnv: false
          secrets: |
            kv/data/ci/playground/order-service username | HARBOR_USERNAME ;
            kv/data/ci/playground/order-service password | HARBOR_PASSWORD
      - name: Log in to Harbor
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: harbor.internal.api-api-api.com
          username: ${{ steps.vault.outputs.HARBOR_USERNAME }}
          password: ${{ steps.vault.outputs.HARBOR_PASSWORD }}
      - name: Ignore a superseded branch commit
        id: current
        shell: bash
        run: |
          set -euo pipefail
          head="$(git ls-remote --exit-code origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          test -n "$head"
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "A newer branch commit exists; this build will not publish."
          fi
      - name: Build and publish image
        id: build
        if: steps.current.outputs.publish == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            harbor.internal.api-api-api.com/playground/order-service:${{ steps.metadata.outputs.tag }}
            harbor.internal.api-api-api.com/playground/order-service:${{ steps.metadata.outputs.channel }}
          labels: |
            org.opencontainers.image.title=order-service
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
            io.gitops.source-branch=${{ github.ref_name }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.tag }}
            org.opencontainers.image.created=${{ steps.metadata.outputs.created }}
      - name: Record published image provenance
        if: steps.current.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_SERVICE: order-service
          RELEASE_REPOSITORY: harbor.internal.api-api-api.com/playground/order-service
          RELEASE_SOURCE_REPOSITORY: ${{ github.repository }}
          RELEASE_SOURCE_COMMIT: ${{ github.sha }}
          RELEASE_SOURCE_BRANCH: ${{ github.ref_name }}
          RELEASE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          digest = os.environ["RELEASE_DIGEST"]
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("The published image digest is missing or invalid")
          release = {
              "service": os.environ["RELEASE_SERVICE"],
              "repository": os.environ["RELEASE_REPOSITORY"],
              "source_repository": os.environ["RELEASE_SOURCE_REPOSITORY"],
              "source_commit": os.environ["RELEASE_SOURCE_COMMIT"],
              "source_branch": os.environ["RELEASE_SOURCE_BRANCH"],
              "digest": digest,
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "release-image.json"
          path.write_text(json.dumps(release, indent=2, sort_keys=True) + "\n")
          print(f"Recorded published image digest: {digest}")
          PY
      - name: Upload published image provenance
        if: steps.current.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-image
          path: ${{ runner.temp }}/release-image.json
          if-no-files-found: error
          retention-days: 90
